name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # Report both legs: a failure on one version is the interesting case, and
      # cancelling the other hides exactly the comparison worth having.
      fail-fast: false
      matrix:
        # 3.14 is what the VPS runs, since DreamHost's November 2026 OS upgrade,
        # and what this repo is developed on. 3.10 is py4web's own floor, and
        # was production until that upgrade. They are not interchangeable:
        # smtplib dropped starttls's keyfile/certfile in 3.12, which mailer.py
        # overrides, so a change can pass on one and fail on the other -- and
        # keeping the floor leg is how the next upgrade stays a non-event.
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No requirements.txt, matching the repo: CLAUDE.md documents installation
      # as a plain `pip install py4web`, and the suite needs nothing past it --
      # pydal, requests and certifi all arrive as py4web's own dependencies.
      # psycopg2-binary is only for reading a local MusicBrainz mirror, which no
      # test touches.
      - run: pip install py4web pytest

      # conftest.py puts apps/newfire on sys.path, so this runs from the root.
      - run: python -m pytest
