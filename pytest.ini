[pytest]
testpaths = tests

# Python 3.14 warns about a `return` inside a `finally` block in anyio, which
# arrives by way of py4web's imports. Not ours to fix, and it otherwise
# prefixes every run with a traceback-shaped block that isn't a failure.
filterwarnings =
    ignore:'return' in a 'finally' block:SyntaxWarning
